name: Update challenge counts

on:
  push:
    branches:
      - main
    paths:
      - "HackerRank_SQL_Challenges/**/*.md"
      - "DataLemur_SQL_Challenges/**/*.md"
      - "HackerRank_Python_Challenges/**/*.md"
      - "DataLemur_Python_Challenges/**/*.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-challenge-counts
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Count solutions and update README
        shell: bash
        run: |
          hacker_rank_sql_count="$(find HackerRank_SQL_Challenges -maxdepth 1 -type f -name '*.md' 2>/dev/null | wc -l | xargs)"
          data_lemur_sql_count="$(find DataLemur_SQL_Challenges -maxdepth 1 -type f -name '*.md' 2>/dev/null | wc -l | xargs)"
          hacker_rank_python_count="$(find HackerRank_Python_Challenges -maxdepth 1 -type f -name '*.md' 2>/dev/null | wc -l | xargs)"
          data_lemur_python_count="$(find DataLemur_Python_Challenges -maxdepth 1 -type f -name '*.md' 2>/dev/null | wc -l | xargs)"
          python3 - "$hacker_rank_sql_count" "$data_lemur_sql_count" "$hacker_rank_python_count" "$data_lemur_python_count" <<'PY'
          from pathlib import Path
          import re
          import sys

          readme = Path("README.md")
          content = readme.read_text()
          hacker_rank_sql = int(sys.argv[1])
          data_lemur_sql = int(sys.argv[2])
          hacker_rank_python = int(sys.argv[3])
          data_lemur_python = int(sys.argv[4])
          sql_total = hacker_rank_sql + data_lemur_sql
          python_total = hacker_rank_python + data_lemur_python
          hacker_rank_total = hacker_rank_sql + hacker_rank_python
          data_lemur_total = data_lemur_sql + data_lemur_python
          grand_total = sql_total + python_total
          replacement = f"""<!-- challenge-counts:start -->
          |  | HackerRank | DataLemur | Total Challenges Solved |
          | --- | ---: | ---: | ---: |
          | SQL | {hacker_rank_sql} | {data_lemur_sql} | {sql_total} |
          | Python | {hacker_rank_python} | {data_lemur_python} | {python_total} |
          | **Total** | **{hacker_rank_total}** | **{data_lemur_total}** | **{grand_total}** |
          <!-- challenge-counts:end -->"""
          updated, replacements = re.subn(
              r"<!-- challenge-counts:start -->.*?<!-- challenge-counts:end -->",
              replacement,
              content,
              flags=re.DOTALL,
          )
          if replacements != 1:
              raise SystemExit("README challenge-count markers are missing or duplicated")
          readme.write_text(updated)
          PY

      - name: Commit updated counts
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update challenge solution counts"
          git push
